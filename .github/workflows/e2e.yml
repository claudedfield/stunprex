name: e2e

# D-WEB-10 / D-WEB-12 — the deterministic tester layer.
#
#   e2e (preview)     - runs on every PR. Deploys the PR's merge commit to
#                       staging.stunprex.com over SSH (D-WEB-27, D-WEB-28), then
#                       tests it, signed-in paths included. A failed build or
#                       migration fails the deploy step, so the check always
#                       concludes. This job owns the `e2e (preview)` context, so
#                       branch protection always gets an answer.
#   e2e (production)  - nightly against the canonical host; never signed in.

on:
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL to test (defaults to production)'
        required: false
        default: 'https://stunprex.com'

permissions:
  contents: read

jobs:
  preview:
    name: e2e (preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One pull request on staging at a time; shared with deploy.yml's staging pushes.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # D-WEB-27 / D-WEB-28: the PR is tested on staging.stunprex.com, not on a
      # Vercel preview. This job deploys the PR's merge commit to staging with the
      # same one-command deploy key as deploy.yml; the server runs the migrations
      # on staging's Neon branch first (decision M) and switches only when both the
      # build and the migrations succeed, so a failed deploy fails this check.
      - name: Deploy this pull request to staging
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz HEAD \
            | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes deploy@"$VPS_HOST" "staging $GITHUB_SHA"

      - name: Run e2e against staging
        env:
          E2E_BASE_URL: https://staging.stunprex.com
          # Enables the signed-in tests; staging's server holds the same secret.
          E2E_SIGNIN_SECRET: ${{ secrets.E2E_SIGNIN_SECRET }}
        run: npx playwright test

      - name: Summarise
        if: always()
        run: node scripts/e2e-summary.mjs --github-summary

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            e2e-results.json
          retention-days: 14

  nightly:
    name: e2e (production)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e against production
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://stunprex.com' }}
        run: npx playwright test
      - name: Summarise
        if: always()
        run: node scripts/e2e-summary.mjs --github-summary

      # ── Nightly mail to coo@ ─────────────────────────────────────────────
      # Production runs only. PR previews are watched by whoever opened the PR;
      # the nightly is the run nobody is sitting in front of, so it is the one
      # that has to reach a human.
      #
      # RED on failure, timeout or cancellation (`cancelled()` covers the
      # timeout-minutes above as well as a manual cancel). OK heartbeat on
      # green, so that silence itself becomes the alarm: a run that never
      # STARTS cannot email about itself, but its missing heartbeat is
      # visible. The COO cycle treats no OK and no RED within 30h as
      # scheduler-dead. That also covers GitHub disabling scheduled workflows
      # after 60 days without commits.

      # Run facts for both subjects, from the same parser the ledger uses so the
      # numbers cannot disagree. Info mode: never fails the job.
      - name: Collect run facts
        id: facts
        if: always()
        run: node scripts/e2e-summary.mjs --gh-output || true

      - name: Build alert body
        if: failure() || cancelled()
        env:
          # Must match the target the tests actually ran against, or the mail
          # names the wrong site. Without this the summary falls back to the
          # config default and would always claim production.
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://stunprex.com' }}
        run: |
          node scripts/e2e-summary.mjs --alert-body e2e-alert.txt || true
          if [ ! -s e2e-alert.txt ]; then
            # Playwright itself never produced a report: still say something useful.
            printf 'The nightly e2e run did not complete normally and produced no test report.\nThe job failed, timed out, or was cancelled before results were written.\n' > e2e-alert.txt
          fi
          {
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> e2e-alert.txt

      - name: Check the mail credentials exist
        id: mailcreds
        if: always()
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$SMTP_PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SMTP_PASS is not set, so no alert mail was sent. See the job summary for the run outcome."
          fi

      - name: Email coo@ that the nightly is red
        if: (failure() || cancelled()) && steps.mailcreds.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.hostinger.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: StunpreX CI <coo@stunprex.com>
          to: coo@stunprex.com
          subject: '[NIGHTLY RED] stunprex.com e2e failed — ${{ steps.facts.outputs.date }}'
          body: file://e2e-alert.txt

      # Heartbeat (D-WEB-14-FU). A scheduler that silently stops firing cannot
      # alert about itself, so silence is made meaningful instead: one line on
      # every green nightly. The COO cycle treats no [NIGHTLY OK] and no
      # [NIGHTLY RED] within 30h as scheduler-dead. No new infrastructure, and
      # it also covers GitHub disabling scheduled workflows after 60 days of no
      # commits on a quiet repo.
      - name: Email coo@ the nightly heartbeat
        if: success() && steps.mailcreds.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.hostinger.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: StunpreX CI <coo@stunprex.com>
          to: coo@stunprex.com
          subject: '[NIGHTLY OK] stunprex.com ${{ steps.facts.outputs.date }} ${{ steps.facts.outputs.passed }}/${{ steps.facts.outputs.total }}'
          body: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            e2e-results.json
          retention-days: 30
