name: e2e

# D-WEB-10 / D-WEB-12 — the deterministic tester layer.
#
#   e2e (preview)     — runs on every PR. Waits for Vercel's preview deployment,
#                       then tests it. If no preview ever arrives (build failed,
#                       deploy skipped), it FAILS with the reason rather than
#                       leaving the PR stuck "waiting" on a check that will never
#                       report. This job owns the `e2e (preview)` context, so
#                       branch protection always gets an answer.
#   e2e (production)  — nightly against the canonical host.
#
# WHY NOT `deployment_status` FOR THE PREVIEW JOB: that event only fires when a
# deploy succeeds, so a failed build produces no event, no check, and a PR that
# blocks forever with no visible cause. Polling from a `pull_request` job inverts
# that — the check always runs and always concludes. It reads Vercel's deploy via
# GitHub's own deployments API, so no Vercel token is needed in CI.

on:
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL to test (defaults to production)'
        required: false
        default: 'https://stunprex.com'

permissions:
  contents: read
  deployments: read

jobs:
  preview:
    name: e2e (preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Wait for the Vercel preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Looking for a preview deployment of $SHA"
          deadline=$(( SECONDS + 900 ))   # 15 minutes
          url=""
          state=""
          while [ $SECONDS -lt $deadline ]; do
            # Vercel registers each build as a GitHub deployment on the head SHA.
            ids=$(gh api "/repos/$REPO/deployments?sha=$SHA&per_page=100" \
                    --jq '.[].id' 2>/dev/null || true)
            for id in $ids; do
              read -r state url < <(gh api "/repos/$REPO/deployments/$id/statuses?per_page=100" \
                --jq '[.[] | select(.state=="success" or .state=="failure" or .state=="error")][0]
                      | "\(.state // "") \(.environment_url // .target_url // "")"' 2>/dev/null || echo " ")
              if [ "${state:-}" = "success" ] && [ -n "${url:-}" ]; then
                echo "found ready preview: $url"
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "${state:-}" = "failure" ] || [ "${state:-}" = "error" ]; then
                echo "::error::Vercel reported the preview deployment as '$state' for $SHA — the build failed, so there is nothing to test."
                exit 1
              fi
            done
            sleep 15
          done
          echo "::error::No Vercel preview deploy — build likely failed, or the deploy was skipped. Waited 15 minutes for a deployment of $SHA and none reached a conclusive state."
          exit 1

      - name: Run e2e against the preview deployment
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
        run: npx playwright test

      - name: Summarise
        if: always()
        run: node scripts/e2e-summary.mjs --github-summary

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            e2e-results.json
          retention-days: 14

  nightly:
    name: e2e (production)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e against production
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://stunprex.com' }}
        run: npx playwright test
      - name: Summarise
        if: always()
        run: node scripts/e2e-summary.mjs --github-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            e2e-results.json
          retention-days: 30
